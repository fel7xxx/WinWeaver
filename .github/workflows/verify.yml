name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and safe regression checks
        shell: powershell
        run: ./scripts/verify.ps1
      - name: Build single-file exe
        run: dotnet publish WinWeaver/WinWeaver.csproj -f net48 -c Release -o out
      - uses: actions/upload-artifact@v4
        with:
          name: WinWeaver-${{ github.sha }}
          path: out/WinWeaver.exe
          retention-days: 14
