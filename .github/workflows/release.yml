name: Release

# Push a tag like v1.0.0 (or create a release with such a tag on GitHub) —
# the exe is built here and attached to the release automatically.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check that the tag matches the program version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $info = Get-Content app/src/Properties/AssemblyInfo.cs -Raw
          if ($info -notmatch 'AssemblyFileVersion\("(\d+\.\d+\.\d+)') { throw 'AssemblyFileVersion not found' }
          if ($Matches[1] -ne $tag) { throw "Tag v$tag does not match the program version $($Matches[1]) in AssemblyInfo.cs" }

      - name: Build
        run: dotnet build app/WinWeaver.csproj -c Release -o out

      - name: Tests
        shell: pwsh
        run: |
          .\tests\check2.ps1 app\engine.ps1
          .\tests\history.tests.ps1

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/WinWeaver.exe -Algorithm SHA256).Hash.ToLower()
          "$h  WinWeaver.exe" | Set-Content out/WinWeaver.exe.sha256 -Encoding ascii
          Write-Host "SHA-256: $h"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/WinWeaver.exe
            out/WinWeaver.exe.sha256
          generate_release_notes: true
