name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build app/WinWeaver.csproj -c Release -o out

      - name: Engine syntax check
        shell: pwsh
        run: .\tests\check2.ps1 app\engine.ps1

      - name: History tests
        shell: pwsh
        run: .\tests\history.tests.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: WinWeaver-${{ github.sha }}
          path: out/WinWeaver.exe
          retention-days: 14
